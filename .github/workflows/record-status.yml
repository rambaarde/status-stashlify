name: Refresh Status Feed

on:
  schedule:
    # Keep the public feed current without relying on the main app stack.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      simulate_service:
        description: 'Force a service to appear down for a manual run'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - dashboard_storefront
          - inventory_sales_orders
          - payments
          - authentication

permissions:
  contents: write

concurrency:
  group: status-feed
  # Never cancel a recorder mid-flight: a cancelled run can die between
  # `git commit` and `git push`, silently dropping that sample. Scheduled runs
  # already arrive in bursts (GitHub defers `*/5`), so queue them instead.
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_REFERER: https://status.stashlify.com
  OPENROUTER_TITLE: Stashlify Status
  SIMULATE_SERVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_service || 'none' }}

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Refresh status recorder
        run: node .github/scripts/refresh-status-json.mjs

      - name: Commit refreshed feed
        run: |
          if [ -z "$(git status --porcelain -- public/status public/status.json)" ]; then
            echo "No feed changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/status public/status.json
          git commit -m "chore(status): refresh uptime feed"

          # This workflow and alert-status.yml both push to main on the same
          # `*/5` schedule, so they collide and one push is rejected as
          # non-fast-forward. Rebase onto whatever landed first and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done

          echo "::error::Could not push refreshed feed after 5 attempts."
          exit 1
